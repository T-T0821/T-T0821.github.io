name: Deep Research Article Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "調査・記事化するトピック (例: React Server Components の仕組み)"
        required: true
        type: string
      filename:
        description: "出力ファイル名 (拡張子なし。省略時はトピックから自動生成)"
        required: false
        type: string
      category:
        description: "記事のカテゴリ"
        required: true
        type: choice
        options:
          - frontend
          - backend
          - ai
          - devops
          - security
          - other
      language:
        description: "記事の言語"
        required: false
        default: "日本語"
        type: choice
        options:
          - 日本語
          - English

permissions:
  contents: write

jobs:
  deep-research:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. チェックアウト
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Node.js セットアップ & Copilot CLI インストール
      # ─────────────────────────────────────────────
      - name: Set up Node.js environment
        uses: actions/setup-node@v4

      - name: Install Copilot CLI
        run: |
          npm install -g @github/copilot
          # バージョン確認
          copilot version || true

      # ─────────────────────────────────────────────
      # 3. シークレット確認
      #    リポジトリ Settings → Secrets → Actions に
      #    COPILOT_PAT を追加してください。
      #    取得先: https://github.com/settings/personal-access-tokens/new
      #    必要な権限: "Copilot Requests" (Read-only)
      # ─────────────────────────────────────────────
      - name: Check COPILOT_PAT secret
        env:
          TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::シークレット COPILOT_PAT が設定されていません。"
            echo "::error::https://github.com/settings/personal-access-tokens/new で"
            echo "::error::「Copilot Requests」権限付き fine-grained PAT を作成し、"
            echo "::error::リポジトリの Settings > Secrets > Actions に COPILOT_PAT として登録してください。"
            exit 1
          fi
          echo "COPILOT_PAT シークレットを確認しました。"

      - name: Check available Copilot agents
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          echo "=== Copilot CLI version ==="
          copilot version || true
          echo "=== Available agents (experimental) ==="
          echo "/agent" | timeout 15 copilot --experimental --allow-all-tools 2>&1 | head -30 || true

      # ─────────────────────────────────────────────
      # 4. 出力ファイル名を決定 (Copilot CLI 実行前に確定)
      # ─────────────────────────────────────────────
      - name: Determine output filename
        id: filename
        env:
          TOPIC: ${{ inputs.topic }}
          CUSTOM_FILENAME: ${{ inputs.filename }}
        run: |
          if [ -n "$CUSTOM_FILENAME" ]; then
            SLUG="$CUSTOM_FILENAME"
          else
            # ASCII 文字のみのスラグ生成
            SLUG=$(echo "$TOPIC" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9 ]//g' \
              | sed 's/ \+/-/g' \
              | sed 's/^-//;s/-$//' \
              | cut -c1-60)

            # 日本語など ASCII にならない場合は日時ベース
            if [ -z "$SLUG" ]; then
              SLUG="research-$(date +%Y%m%d-%H%M%S)"
            fi
          fi

          TODAY=$(date +%Y-%m-%d)
          CATEGORY="${{ inputs.category }}"
          echo "slug=$SLUG"                             >> "$GITHUB_OUTPUT"
          echo "filepath=docs/${CATEGORY}/${SLUG}.md"  >> "$GITHUB_OUTPUT"
          echo "dirpath=docs/${CATEGORY}"               >> "$GITHUB_OUTPUT"
          echo "date=$TODAY"                            >> "$GITHUB_OUTPUT"
          echo "生成ファイルパス: docs/${CATEGORY}/${SLUG}.md"

      # ─────────────────────────────────────────────
      # 5. Copilot CLI で Deep Research を実行し指定パスへ直接書き込む
      #    ※ copilot -p はエージェントとして動作しファイルを自律的に
      #      作成する。stdout はエージェントログのため使用しない。
      # ─────────────────────────────────────────────
      - name: Run Deep Research via Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          FILEPATH: ${{ steps.filename.outputs.filepath }}
          DIRPATH: ${{ steps.filename.outputs.dirpath }}
          CATEGORY: ${{ inputs.category }}
          TODAY: ${{ steps.filename.outputs.date }}
        run: |
          mkdir -p "$DIRPATH"

          # プロンプトをファイルに書き出す (改行・特殊文字を安全に扱うため)
          cat > /tmp/copilot_prompt.txt << 'PROMPT_EOF'
          以下のトピックについて深く調査し、技術ブログ記事を作成してください。
          PROMPT_EOF

          # 変数展開が必要な部分は別途追記
          cat >> /tmp/copilot_prompt.txt << PROMPT_EOF

          トピック: ${TOPIC}

          出力先ファイルパス: ${FILEPATH}

          ファイルには以下の形式で書き込んでください。
          最初に YAML フロントマターを記述し、その後に記事本文を続けます:

          ---
          title: "<記事タイトル>"
          date: ${TODAY}
          category: "${CATEGORY}"
          description: "<記事の1〜2文の概要>"
          lang: "${LANGUAGE}"
          ---

          <${LANGUAGE}での Markdown 記事本文>

          記事の要件:
          - タイトルは「# タイトル」で始める
          - 概要・背景、詳細な解説、コード例（適切な言語タグ付き）、実践的なユースケース、まとめ のセクションを含める
          - VitePress の Markdown 記法に対応した内容にする
          - 読者が実際に動かせるよう具体的なコードスニペットを含める
          - 記事の最後に「## 参考資料」セクションを設け、調査・執筆の際に参照した公式ドキュメント・ブログ・GitHub リポジトリ等の URL をリスト形式で列挙する（各リンクは [タイトル](URL) 形式で記述すること）

          上記のファイルパスにファイルを作成してください。
          PROMPT_EOF

          # research エージェントで実行、失敗時(No such agent等)はデフォルトにフォールバック
          set +e
          cat /tmp/copilot_prompt.txt | copilot -p /research --allow-all-tools
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::research エージェントが利用できなかったため、デフォルトエージェントで再試行します"
            cat /tmp/copilot_prompt.txt | copilot --experimental --allow-all-tools
          fi

          # ファイルが生成されているか確認
          if [ ! -f "$FILEPATH" ]; then
            echo "::error::Copilot CLI がファイルを生成しませんでした: $FILEPATH"
            exit 1
          fi

          echo "ファイルを生成しました: $FILEPATH"
          echo "--- 内容プレビュー (先頭30行) ---"
          head -30 "$FILEPATH"

      # ─────────────────────────────────────────────
      # 6. コミット & プッシュ
      # ─────────────────────────────────────────────
      - name: Commit and push
        env:
          FILEPATH:  ${{ steps.filename.outputs.filepath }}
          TOPIC:     ${{ inputs.topic }}
          CATEGORY:  ${{ inputs.category }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FILEPATH"

          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "docs(${CATEGORY}): Deep Research 記事を追加「${TOPIC}」"
            git push
            echo "記事をリポジトリにプッシュしました: $FILEPATH"
          fi
