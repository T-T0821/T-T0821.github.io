name: Deep Research Article Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "調査・記事化するトピック (例: React Server Components の仕組み)"
        required: true
        type: string
      filename:
        description: "出力ファイル名 (拡張子なし。省略時はトピックから自動生成)"
        required: false
        type: string
      category:
        description: "記事のカテゴリ"
        required: true
        type: choice
        options:
          - frontend
          - backend
          - ai
          - devops
          - security
          - other
      language:
        description: "記事の言語"
        required: false
        default: "日本語"
        type: choice
        options:
          - 日本語
          - English

permissions:
  contents: write

jobs:
  deep-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Validate COPILOT_PAT secret
        env:
          TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          [ -n "$TOKEN" ] || {
            echo "::error::COPILOT_PAT が未設定です。Settings > Secrets > Actions に登録してください。"
            exit 1
          }

      - name: Resolve output filepath
        id: filename
        env:
          TOPIC: ${{ inputs.topic }}
          CUSTOM_FILENAME: ${{ inputs.filename }}
          CATEGORY: ${{ inputs.category }}
        run: |
          if [ -n "$CUSTOM_FILENAME" ]; then
            SLUG="$CUSTOM_FILENAME"
          else
            SLUG=$(echo "$TOPIC" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9 ]//g; s/ \+/-/g; s/^-//; s/-$//' \
              | cut -c1-60)
            [ -n "$SLUG" ] || SLUG="research-$(date +%Y%m%d-%H%M%S)"
          fi

          echo "filepath=docs/${CATEGORY}/${SLUG}.md" >> "$GITHUB_OUTPUT"
          echo "dirpath=docs/${CATEGORY}"             >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)"               >> "$GITHUB_OUTPUT"

      - name: Run Deep Research via Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          FILEPATH: ${{ steps.filename.outputs.filepath }}
          DIRPATH: ${{ steps.filename.outputs.dirpath }}
          CATEGORY: ${{ inputs.category }}
          TODAY: ${{ steps.filename.outputs.date }}
        run: |
          mkdir -p "$DIRPATH"

          PROMPT=$(cat << EOF
          /research ${TOPIC}

          調査結果を ${FILEPATH} に技術ブログ記事として書き込んでください。

          フロントマター:
          ---
          title: "<記事タイトル>"
          date: ${TODAY}
          category: "${CATEGORY}"
          description: "<1〜2文の概要>"
          lang: "${LANGUAGE}"
          ---

          ${LANGUAGE} での記事本文の要件:
          - 「# タイトル」で始める
          - 概要・背景 / 詳細解説 / コード例 / ユースケース / まとめ のセクションを含める
          - VitePress Markdown 記法に準拠し、実行可能なコードスニペットを含める
          - 末尾に「## 参考資料」として参照 URL を [タイトル](URL) 形式でリスト化する
          EOF
          )

          echo "$PROMPT" | sed 's/^          //' | copilot -p - --allow-all-tools

          [ -f "$FILEPATH" ] || {
            echo "::error::ファイルが生成されませんでした: $FILEPATH"
            exit 1
          }

      - name: Commit and push
        env:
          FILEPATH: ${{ steps.filename.outputs.filepath }}
          TOPIC: ${{ inputs.topic }}
          CATEGORY: ${{ inputs.category }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILEPATH"
          git diff --cached --quiet && exit 0
          git commit -m "docs(${CATEGORY}): Deep Research 記事を追加「${TOPIC}」"
          git push
